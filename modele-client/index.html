<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prénom Nom</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800&display=swap">
<style>
/* ================================================================
   MODÈLE DE PAGE CLIENT — ATTI-NFC
   Pour un nouveau client : duplique ce dossier (ex. /c/lea-martin/),
   change CLIENT dans le <script> en bas et les couleurs juste ici.
   Ne supprime pas le bloc "ATTI-NFC" en bas de page.
   ================================================================ */
:root {
  --bg: #f4f1ec;        /* fond de la page du client */
  --ink: #141313;       /* texte */
  --accent: #e10600;    /* couleur du client (boutons) */
  --card: #ffffff;
  --display: "Anton", Impact, "Arial Narrow", sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body);
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* --- Contenu du client --- */
.photo { width: 132px; height: 132px; object-fit: cover; border-radius: 50%; border: 4px solid var(--card); box-shadow: 0 8px 20px rgba(0,0,0,.15); margin: 8px auto 0; background: #ddd; display: block; }
h1 { margin: 6px 0 0; text-align: center; font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(32px, 10vw, 44px); line-height: .95; }
.role { margin: 0; text-align: center; font-weight: 700; color: #5b5754; }
.save, .link {
  display: flex; align-items: center; gap: 12px; width: 100%; text-decoration: none; color: var(--ink);
  background: var(--card); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  padding: 15px 18px; font-weight: 800; font-size: 16.5px; font-family: inherit; cursor: pointer;
}
.save { justify-content: center; background: var(--accent); color: #fff; margin-top: 8px; font-family: var(--display); font-weight: 400; font-size: 21px; letter-spacing: .04em; text-transform: uppercase; }
.link .arrow { margin-left: auto; color: var(--accent); font-family: var(--display); font-size: 20px; }
.link:hover { transform: translateY(-2px); }

/* --- ATTI-NFC : à garder sur toutes les pages client --- */
.atti { margin-top: 30px; display: grid; gap: 10px; justify-items: center; }
.atti-cta {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
  background: #111010; color: #fff; text-decoration: none; padding: 14px 16px;
  border: 2px solid #111010; box-shadow: 4px 4px 0 #e10600; font-weight: 800; font-size: 15px;
}
.atti-cta svg { flex: none; }
.atti-cta:hover { background: #e10600; }
.atti-badge {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: #111010;
  font-size: 12px; font-weight: 700; letter-spacing: .02em; opacity: .75;
}
.atti-badge b { font-family: "Anton", Impact, sans-serif; font-weight: 400; font-size: 14px; letter-spacing: .1em; color: #e10600; }
.atti-badge:hover { opacity: 1; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <img class="photo" id="photo" alt="" width="132" height="132">
  <h1 id="name"></h1>
  <p class="role" id="role"></p>
  <button class="save" id="save" type="button">Enregistrer mon contact</button>
  <div id="links" style="display:grid; gap:12px; margin-top:6px;"></div>

  <!-- ===== ATTI-NFC (ne pas supprimer) ===== -->
  <div class="atti">
    <a class="atti-cta" id="attiCta" href="https://attilio-design.com/commander/">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M14 10a3 3 0 010 4M16.5 8a6 6 0 010 8"/></svg>
      Moi aussi je veux ma carte NFC
    </a>
    <a class="atti-badge" href="https://attilio-design.com/commander/">Carte créée par <b>ATTI-NFC</b></a>
  </div>
  <!-- ===== fin ATTI-NFC ===== -->
</div>

<script>
/* ===== À REMPLIR POUR CHAQUE CLIENT ===== */
var CLIENT = {
  prenom: "Prénom",
  nom: "Nom",
  role: "Son métier",
  photo: "",                       // lien ou image en base64
  telephone: "+33600000000",
  email: "email@exemple.fr",
  site: "",
  code: "PRENOMXXX",               // son code de parrainage (dans le mail de commande)
  liens: [
    { titre: "Instagram", sous: "@pseudo", url: "https://instagram.com/" },
    { titre: "Mon site", sous: "exemple.fr", url: "https://exemple.fr" }
  ]
};
/* ======================================== */

function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
var full = CLIENT.prenom + " " + CLIENT.nom;
document.title = full;
document.getElementById("name").textContent = full;
document.getElementById("role").textContent = CLIENT.role;
var ph = document.getElementById("photo");
if (CLIENT.photo) { ph.src = CLIENT.photo; ph.alt = full; } else { ph.remove(); }

var box = document.getElementById("links");
CLIENT.liens.concat([
  { titre: "M'appeler", sous: CLIENT.telephone, url: "tel:" + CLIENT.telephone },
  { titre: "M'écrire", sous: CLIENT.email, url: "mailto:" + CLIENT.email }
]).forEach(function (l) {
  if (!l.sous && !l.url) return;
  var a = document.createElement("a");
  a.className = "link"; a.href = l.url;
  if (/^https?:/.test(l.url)) { a.target = "_blank"; a.rel = "noopener"; }
  a.innerHTML = '<span style="display:grid"><span>' + esc(l.titre) + '</span><small style="font-weight:500;opacity:.6;font-size:12px">' + esc(l.sous || "") + '</small></span><span class="arrow">→</span>';
  box.appendChild(a);
});

/* Lien de parrainage du client sur le bouton ATTI-NFC */
var REF_URL = "https://attilio-design.com/commander/?ref=" + encodeURIComponent(CLIENT.code);
document.getElementById("attiCta").href = REF_URL;

document.getElementById("save").addEventListener("click", function () {
  var v = ["BEGIN:VCARD", "VERSION:3.0", "N:" + CLIENT.nom + ";" + CLIENT.prenom + ";;;", "FN:" + full,
    "TITLE:" + CLIENT.role, "TEL;TYPE=CELL:" + CLIENT.telephone, "EMAIL:" + CLIENT.email]
    .concat(CLIENT.site ? ["URL:" + CLIENT.site] : []).concat(["END:VCARD"]).join("\r\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([v], { type: "text/vcard" }));
  a.download = full.replace(/\s+/g, "-") + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
</body>
</html>
